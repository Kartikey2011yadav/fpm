name: Homebrew

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release assets and compute SHA256
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BASE="https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}"

          curl -sL "${BASE}/fpm-${VERSION}-darwin-amd64.tar.gz" | sha256sum | awk '{print $1}' > /tmp/darwin-amd64.sha256
          curl -sL "${BASE}/fpm-${VERSION}-darwin-arm64.tar.gz" | sha256sum | awk '{print $1}' > /tmp/darwin-arm64.sha256
          curl -sL "${BASE}/fpm-${VERSION}-linux-amd64.tar.gz" | sha256sum | awk '{print $1}' > /tmp/linux-amd64.sha256
          curl -sL "${BASE}/fpm-${VERSION}-linux-arm64.tar.gz" | sha256sum | awk '{print $1}' > /tmp/linux-arm64.sha256

          echo "darwin_amd64=$(cat /tmp/darwin-amd64.sha256)" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(cat /tmp/darwin-arm64.sha256)" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(cat /tmp/linux-amd64.sha256)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(cat /tmp/linux-arm64.sha256)" >> $GITHUB_OUTPUT

      - name: Generate formula
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cat > /tmp/fpm.rb << FORMULA
          class Fpm < Formula
            desc "Fast Package Manager for Python"
            homepage "https://github.com/Kartikey2011yadav/fpm"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
              on_arm do
                url "https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
              on_arm do
                url "https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
            end

            def install
              bin.install "fpm"
            end

            test do
              assert_match "fpm", shell_output("#{bin}/fpm --version")
            end
          end
          FORMULA

      - name: Push to homebrew-tap
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.TAP_GITHUB_TOKEN }}
        with:
          source_file: /tmp/fpm.rb
          destination_repo: Kartikey2011yadav/homebrew-tap
          destination_folder: Formula
          user_email: "github-actions@github.com"
          user_name: "github-actions"
          commit_message: "Update fpm to v${{ steps.version.outputs.version }}"
