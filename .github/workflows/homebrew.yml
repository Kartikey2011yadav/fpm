name: Homebrew

on:
  push:
    tags: ["v*"]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Waiting for release assets for v${VERSION}..."
          for i in $(seq 1 30); do
            URL="https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-darwin-arm64.tar.gz"
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "${URL}")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Assets available!"
              break
            fi
            echo "Attempt $i: not ready yet (HTTP ${HTTP_CODE}), waiting 30s..."
            sleep 30
          done

      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release assets and compute SHA256
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BASE="https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}"

          for PLATFORM in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            URL="${BASE}/fpm-${VERSION}-${PLATFORM}.tar.gz"
            echo "Downloading ${URL}..."
            HTTP_CODE=$(curl -sL -o /tmp/${PLATFORM}.tar.gz -w "%{http_code}" "${URL}")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: Failed to download ${PLATFORM} (HTTP ${HTTP_CODE})"
              exit 1
            fi
            SHA=$(sha256sum /tmp/${PLATFORM}.tar.gz | awk '{print $1}')
            echo "${PLATFORM//-/_}=${SHA}" >> $GITHUB_OUTPUT
          done

      - name: Generate and push formula to tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}

          cat > /tmp/fpm.rb << EOF
          class Fpm < Formula
            desc "Fast Package Manager for Python"
            homepage "https://github.com/Kartikey2011yadav/fpm"
            license "MIT"
            version "${VERSION}"

            on_macos do
              on_intel do
                url "https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
              on_arm do
                url "https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
              on_arm do
                url "https://github.com/Kartikey2011yadav/fpm/releases/download/v${VERSION}/fpm-${VERSION}-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
            end

            def install
              bin.install "fpm"
            end

            test do
              assert_match "fpm", shell_output("#{bin}/fpm --version")
            end
          end
          EOF

          # Clone tap, update formula, push
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/Kartikey2011yadav/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/fpm.rb /tmp/tap/Formula/fpm.rb
          cd /tmp/tap
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add Formula/fpm.rb
          git commit -m "Update fpm to v${VERSION}" || echo "No changes"
          git push
