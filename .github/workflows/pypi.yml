name: PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package version
        run: |
          cd pip-package
          VERSION="${{ steps.version.outputs.version }}"
          python -c "
          import re, pathlib

          # Update pyproject.toml
          toml = pathlib.Path('pyproject.toml')
          toml.write_text(re.sub(r'version = \".*?\"', f'version = \"${VERSION}\"', toml.read_text(), count=1))

          # Update __init__.py
          init = pathlib.Path('fpm_pkg/__init__.py')
          init.write_text(re.sub(r'__version__ = \".*?\"', f'__version__ = \"${VERSION}\"', init.read_text(), count=1))
          "

      - name: Build package
        run: |
          pip install build
          cd pip-package
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pip-package/dist/
