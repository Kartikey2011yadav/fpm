[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fpm-cli"
version = "0.1.0"
description = "Fast Package Manager for Python — binary distribution"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kartikey Yadav"}]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]
keywords = ["package-manager", "python", "pip", "fast", "install"]

[project.urls]
Homepage = "https://github.com/Kartikey2011yadav/fpm"
Repository = "https://github.com/Kartikey2011yadav/fpm"
Issues = "https://github.com/Kartikey2011yadav/fpm/issues"

[project.scripts]
fpm = "fpm_pkg:main"

[tool.setuptools.packages.find]
include = ["fpm_pkg*"]
